<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <!-- Warm Amber / Brushed Bronze Gradient -->
    <linearGradient id="nobajBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="titaniumSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262A34" />
      <stop offset="100%" stop-color="#14171F" />
    </linearGradient>
  </defs>

  <!-- Iconic Minimalist Monogram / Lens Emblem -->
  <g transform="translate(8, 8)">
    <!-- Base container -->
    <rect width="44" height="44" rx="14" fill="url(#titaniumSheen)" stroke="#2E3440" stroke-width="1.5" />
    
    <!-- Precision Aperture / Waveform Geometry -->
    <path d="M14 22C14 17.5817 17.5817 14 22 14H24C27.3137 14 30 16.6863 30 20V24C30 28.4183 26.4183 32 22 32H20C16.6863 32 14 29.3137 14 26V22Z" fill="url(#nobajBronze)" />
    <!-- Cutout prism accent -->
    <polygon points="20,18 28,23 20,28" fill="#0C0E12" />
    <circle cx="34" cy="14" r="2.5" fill="#F59E0B" />
  </g>

  <!-- Typography: Clean, architectural, timeless -->
  <text x="64" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
    Nobaj
  </text>
  <rect x="146" y="22" width="46" height="18" rx="5" fill="#1E232F" stroke="#333A48" stroke-width="1" />
  <text x="169" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#F59E0B" letter-spacing="1.2" text-anchor="middle">
    STUDIO
  </text>
  <text x="65" y="49" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="0.8">
    MEDIA SUITE
  </text>
</svg>
